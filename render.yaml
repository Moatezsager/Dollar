services:
  - type: web
    name: lyd-index
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Worker Server integration — set these in Render dashboard
      - key: WORKER_URL
        sync: false   # Set manually: URL of the Worker Server (e.g. https://lyd-index-worker.onrender.com)
      - key: WORKER_INTERNAL_SECRET
        sync: false   # Set manually: must match WORKER_INTERNAL_SECRET in the Worker Server

